
name: Build Consulta a los Junimos APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ConsultaJunimosAndroid.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: unzip -q ConsultaJunimosAndroid.zip

      - name: Compilar APK
        run: gradle -p ConsultaJunimosAndroid assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Consulta-a-los-Junimos-APK
          path: ConsultaJunimosAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
